# verify/request.yaml — one verification request, cv-infra v2.
#
# Three files, one directory: this document, the embodiment profile it names, and
# the input-space model. Every ride-along path is relative to THIS file's directory
# and may not leave it — that directory is what gets mounted read-only into the
# runner, so a path outside it does not exist over there.
#
# Nothing here names anything the platform had to be taught about this robot.

apiVersion: cv-infra/v1

embodiment: embodiment.yaml              # what world and what body (see that file)

scenario:
  goal:                                  # map extent x[-11.975, 12.03] y[-17.975, 20.83];
    x: -6.0                              #   AMCL start pose is (-6.0, -1.0, yaw=pi), so this
    y: 5.0                               #   is a short straight drive up the same lane.
    yaw: {param: goal_yaw}               # <- covering-array axis: the heading we arrive on
    frame: map
  seed: 42                               # determinism input; also seeds the per-repeat jitter below
  timeout_s: 120                         # SIM-time mission budget (measured t2g 8.4~10.5 s)

  initial_pose:                          # a DISTRIBUTION, not a PICT axis — see space.pict for why:
    x: {uniform: [-6.3, -5.7]}           #   we want the same approach shaken on every repeat,
    y: {uniform: [-1.3, -0.7]}           #   not three named start poses in the covering array.
    yaw: {uniform: [2.9916, 3.2916]}     # pi +/- 0.15 rad (~ +/-8.6 deg)

  obstacles:                             # assets named by USD path — no platform registration.
    - asset: /Isaac/Environments/Office/Props/SM_Chair.usd
      count: 1
      x: {uniform: [-2.6, -2.0]}         # >= 3.1 m off the course -> surface clearance >= 2.68 m
      y: {param: chair_y}                # <- covering-array axis
    - asset: /Isaac/Environments/Office/Props/SM_SecretaryDeskA.usd
      count: {param: desk_count}         # <- covering-array axis (0 / 2 / 5)
      x: {uniform: [-1.5, 0.0]}          # open floor north-east of the goal
      y: {uniform: [5.5, 10.5]}
      yaw: {uniform: [-3.1416, 3.1416]}  # any bearing; clearance holds at the worst one
    - asset: /Isaac/Props/Forklift/forklift.usd
      count: 2
      x: {uniform: [-1.0, 1.0]}
      y: {uniform: [0.0, 4.0]}
      yaw: {param: forklift_yaw}         # <- covering-array axis (0 or 90 deg)

space:
  model: space.pict
  array: space.array.tsv                 # the array cv-infra emitted last time, committed and seeded
  budget:                                #   back in — this is what keeps case identity, and therefore
    wallclock_s: 3600                    #   the regression baselines, alive across an edit to the model
    repeats: 3
    max_order: 2

sut:
  image_ref: ghcr.io/yongjunshin/cv-infra-user/carter-sut@sha256:dc14a93cafca495419a92aee8c09070d29d38cfc62825919e192eb60390483b0

mission:
  kind: goal_pose                        # the built-in driver: send one pose, wait. Omitting the whole
                                         # block means exactly this, so a pre-v2 document needs no edit.
                                         # A robot whose mission is not "go to a pose" writes
                                         # `kind: my_mission:MyMission` here instead — a module beside
                                         # this file, loaded the way a custom oracle is.

interface:
  type: ros2
  adapter_config:                        # UNCHANGED from v1 — the SUT wiring was never the problem
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:                         # the same Odometry stream wired to both consumers
      - /odom
      - /chassis/odom
    sensors:
      - topic: /front_3d_lidar/lidar_points
        type: sensor_msgs/msg/PointCloud2
        frame: front_3d_lidar
      - topic: /front_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: front_2d_lidar
      - topic: /back_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: back_2d_lidar
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:                           # the action server is DDS-discoverable while still inactive,
      is_active_service: /lifecycle_manager_navigation/is_active   # so gate on this Trigger instead

acceptance_criteria:
  - oracle: reached_goal
    params:
      position_tolerance_m: 0.75
      yaw_tolerance_rad: 0.26            # ~15 deg
  - oracle: no_collision
    params:
      chassis_path: /World/Nova_Carter_ROS/chassis_link
      collision_excluded_paths:
        - /World/Nova_Carter_ROS                          # self-body subtree (wheels, casters)
        - /World/warehouse_with_forklifts/GroundPlane     # the floor
