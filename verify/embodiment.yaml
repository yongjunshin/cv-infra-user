# verify/embodiment.yaml — this robot's world and body, ours to declare.
#
# cv-infra provides Isaac Sim, the ROS 2 bridge, fixed-dt determinism, ground-truth
# telemetry, isolation and reporting. It does not know which scene or which robot —
# that is this file, and the platform reproduces it without interpreting a value.
#
# This one is SHORT, and the shortness is the point. The scene asset we use ships
# its own robot, its own ROS 2 OmniGraphs (clock / TF / odom / sensors / cmd_vel)
# and its own sensors, so there is nothing for the runner to compose or publish.
# Every field that would say "compose this" simply stays absent.
#
# Compare cv-infra-user-go2/verify/embodiment.yaml: a robot-free warehouse plus a
# referenced quadruped, which has to declare its drop height, its onboard policy
# and its whole sensor rig — about 100 lines. Same schema, opposite ends of it.

world:
  # The official ROS 2 navigation sample: warehouse + Nova Carter + graphs, one file.
  scene_usd: /Isaac/Samples/ROS2/Scenario/carter_warehouse_navigation.usd

robot:
  # Where the robot the ASSET placed can be found. A candidate list, not a single
  # path: NVIDIA's own prim naming has moved between asset revisions, and a list
  # degrades to a loud "none of these exist" instead of a silently wrong pin.
  prim_candidates:
    - /World/Nova_Carter_ROS
    - /World/Carter_ROS
  # The body ground-truth pose and contacts are read from (no_collision anchors here).
  chassis_prim: /World/Nova_Carter_ROS/chassis_link

  # Deliberately ABSENT, and each absence means something:
  #   usd / spawn_prim / spawn_z  — the asset already placed the robot.
  #   onboard                     — a wheeled base takes /cmd_vel straight to its
  #                                 differential drive; there is no policy to run
  #                                 in the physics loop.
  #   sensors                     — the asset's own publish graphs already serve
  #                                 every topic the SUT subscribes to.
  #   reset_joint_pos             — wheel angles are not a stance; where a mission
  #                                 starts does not depend on them.
  #   render_interval             — renders every step (the default), unchanged.
