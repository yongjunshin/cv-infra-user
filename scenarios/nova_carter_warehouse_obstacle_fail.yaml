# nova_carter_warehouse_obstacle_fail.yaml — fail-expected variant (P2-04
# regression leg): inject a low box into the lane via the D-2' contract slot
# scenario.debug_obstacle (an obstacle is WORLD STATE, not a criterion — the
# P2-era free-form criteria-params slot is retired; putting debug_obstacle
# under acceptance_criteria now loud-rejects).
#
# Diff vs canonical nova_carter_warehouse_goal.yaml (ONLY this — criteria and
# every other value stay canonical, see that file for provenance):
#   scenario.debug_obstacle — the P2-04 run7 "drive-by graze" spec at run7's
#   coordinates, with the box height RETUNED 0.15 -> 0.10 m on 2026-08-29 T5
#   evidence (see EXPECTED): a half-lane low box that the blackbox nav's ACTIVE
#   perception stack (3D lidar -> laserscan + static map) cannot see, because
#   its top sits BELOW the measured scan band floor, so the chassis grazes it
#   while the goal stays reachable => a PURE verdict=fail (no_collision
#   violated, reached_goal still passing — not a timeout).
#
# EXPECTED = fail, exit 1 — MEASURED (2026-08-29 T5 arms I/J, 10 GPU samples;
# reports/runner-2026-08-29-p7c3-t5-obstacle-visibility-control §8.2). The risk
# this header used to surface DID materialize, so the fixture was retuned:
#   * arm I (the former 0.15 m box, same x/y): LEAKED — 2/5 pass (nav saw the
#     box and steered around it, /scan detection 4/62 = 6 %) plus 2 timeouts
#     (chassis wedged on it, collision_count 6757~6759). A fixture that passes
#     2 times in 5 does not fail on purpose; it fails to fail.
#   * arm J (0.10 m, this file's value): STABLE — 0/5 pass (4x fail + 1x
#     timeout), collision_count 770~971, /scan detection 0/90. That is the
#     "graze while the goal stays reachable" shape this fixture exists for.
# WHY THE HEIGHT DECIDES IT: this SUT's AMCL eats a /scan built by
# pointcloud_to_laserscan (min_height -0.4) from the 3D lidar prim XT_32,
# measured at world z 0.5256 m => the scan band floor is 0.1256 m, and the
# runner centres a box at height/2 so its top IS the declared height. 0.10 m
# sits 2.6 cm BELOW the band (nav cannot avoid what it cannot see); 0.15 m sits
# 2.4 cm INSIDE it (intermittently visible — the 6 % above). The legacy runner
# comment that 0.15 m keeps a box "below the 2D lidar plane" is false for this
# SUT (T5 §4.1) — that stale premise is what this fixture had been resting on.
# CAVEAT (honest) — two ways arms I/J differ from THIS document, so what they
# settle is the HEIGHT question, not this file's exact geometry:
#   (1) they drove these coordinates from the obstacles-random document's 5
#       RANDOMIZED initial poses, not from this file's static canonical pose;
#   (2) their box carried the RUNNER-DEFAULT footprint 1.2 x 0.4 m, not run7's
#       0.5 x 0.6 m kept below. Evidence is the pool prim T5 names for the
#       wedged samples, `/World/cv_obstacles/box_589520f7_0`: that slug is
#       sha256(repr(("box", (1.2, 0.4, 0.15))))[:8], i.e. width/depth were left
#       unspecified. A 1.2 m x-extent spans the whole lane (hence their
#       timeouts); run7's 0.5 m one grazes, which is the verdict shape this
#       fixture wants — and lowering the height only makes contact MORE likely,
#       since nav can no longer see the box to steer around it.
# One standalone run of THIS file is what confirms the file itself.
# Provenance kept: the original P2-04 run7 evidence at these coordinates —
# collision_count 3603, time_to_goal 66.7 s, path 7.64 m (workstation
# ~/cv-infra-p2-out/p2c5/{variants/p2c5_fail2.yaml, run7/*/result/result.json},
# an EXPIRED anchor; the numbers also live in WORKLOG cycle-5).

apiVersion: cv-infra/v1

scenario:
  scene: nova_carter_warehouse
  robot: nova_carter
  goal:
    x: -6.0
    y: 5.0
    yaw: 1.5708
    frame: map
  seed: 42
  timeout_s: 120
  debug_obstacle:                        # D-2' slot (world state) — P2-04 run7 measured spec,
    x: -6.35                             #   half-lane graze: chassis contact + goal reachable
    y: 2.0
    height: 0.10                         # 0.15 -> 0.10 (T5 arm I leaked 2/5, arm J 0/5 — header)
    width: 0.5
    depth: 0.6

sut:
  # identical to canonical — see nova_carter_warehouse_goal.yaml for this digest's
  # provenance. CI always overrides it; it is the standalone default. The former
  # `carter-sut:p2` was deleted in the p5c19 production cutover (not re-fetchable).
  image_ref: ghcr.io/yongjunshin/cv-infra-user/carter-sut@sha256:dc14a93cafca495419a92aee8c09070d29d38cfc62825919e192eb60390483b0

interface:
  type: ros2
  adapter_config:                        # identical to canonical (M1 canonical keys, measured values)
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:
      - /odom
      - /chassis/odom
    sensors:
      - topic: /front_3d_lidar/lidar_points
        type: sensor_msgs/msg/PointCloud2
        frame: front_3d_lidar
      - topic: /front_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: front_2d_lidar
      - topic: /back_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: back_2d_lidar
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:                     # identical to canonical — the ONLY delta is the obstacle
  - oracle: reached_goal
    params:
      position_tolerance_m: 0.75
      yaw_tolerance_rad: 0.26
  - oracle: no_collision
    params:
      chassis_path: /World/Nova_Carter_ROS/chassis_link
      collision_excluded_paths:
        - /World/Nova_Carter_ROS
        - /World/warehouse_with_forklifts/GroundPlane
