# nova_carter_warehouse_obstacles_low_random.yaml — p7 장애물 표기의 소비자 인스턴스,
# **CI 게이트용(pass 기대)**. 형제 파일 `nova_carter_warehouse_obstacles_random.yaml`(가구 3종)은
# 같은 창·같은 개수 축을 실자산으로 행사하지만 **게이트가 아니다** — 그 이유가 이 파일이 존재하는
# 이유다(아래 ★T5). 스키마·파생·자산 레지스트리는 플랫폼(M1/M2) 소유 — 이 파일은 그것을 *행사*할 뿐이다.
#
# 소비자 스토리는 형제 파일과 같다: 창고는 비어 있지 않다. 같은 미션을 **표본마다 장애물의
# 개수·위치·자세를 바꿔가며** 5번 돌리고, **5표본 중 4개 이상 통과**(`min_pass_ratio: 0.8`)해야
# PR이 초록이 된다. 분포는 Check/sticky 표(`repeats`/`pass`/`fail`/`flaky`)에 그대로 보인다.
#
# ★T5 실측(2026-08-29, GPU 12팔 60표본 — reports/runner-2026-08-29-p7c3-t5-obstacle-visibility-control)
#   **왜 0.10 m 상자인가.** 이 SUT는 `pointcloud_to_laserscan`(`min_height −0.4`,
#   `target_frame front_3d_lidar`)로 `/scan`을 만들고 AMCL(`likelihood_field`)이 그걸 먹는다.
#   3D 라이다 프림 `XT_32`의 world z가 **0.5256 m**로 실측됐으므로
#   **스캔 밴드 바닥 = 0.5256 − 0.4 = 0.1256 m**다(러너가 상자를 `height/2`에 놓아 바닥에 붙이므로
#   상자 윗면 = 선언 높이).
#     * **0.10 m** 상자 윗면 = 밴드 바닥 **2.6 cm 아래** → `/scan`에 **안 보인다**.
#     * 0.15 m 상자 윗면 = 밴드 **2.4 cm 안** → 간헐적으로 보인다(검출률 17 %).
#   지도에 없는 장애물이 `/scan`에 보이면 AMCL 믿음이 어긋나고, 그 믿음 오차가 오라클의 GT 거리로
#   그대로 전이된다(T5 §4.3: `GT_min = 0.728·b_end + 0.157`, r = 0.769 — 즉 판정이 0.75 m
#   tolerance 경계 위에 올라앉는다). 좌표·개수·발자국·콜라이더를 전부 고정하고 **높이만** 내린 대조:
#       팔 C (box 0.15 m): `/scan` 검출 53/314 (17 %) · pass 3/5 · 종료 믿음 오차 max **5.663 m**
#       팔 H (box 0.10 m): `/scan` 검출 **0/241 (0 %)** · pass **5/5** · 믿음 오차 0.157~0.728 m · abort 0
#   **팔 H의 입력이 곧 이 파일이 만드는 것이다** — "CI 파생 그대로의 코스 밖 장애물(표본별 3~8개,
#   최대 8)을 0.10 m 상자로 바꾼 것". 위약 대조(장애물 0인 팔 A)의 오검출은 0/218이라 검출기 자체가
#   배경을 장애물로 읽는 것도 아니다.
#
# ★ 무엇을 유지하고 무엇을 끊었나 — 표현력은 유지하고 **가시성만** 끊는다
#   * 유지: 위치 창 · yaw 랜덤 · 개수 축(1 / `{randint: [0, 5]}` / 2) · 초기포즈 창 · goal · seed ·
#     `repeats`/`min_pass_ratio` · 판정 기준 · 풀 다중도(표본별 최대 8 prim) — 전부 형제 파일과 동일.
#     draw 순서까지 동일하므로 **이 문서의 5표본 좌표·개수는 형제 파일의 5표본과 같은 값**이다
#     (치수는 draw를 소비하지 않는다) = 팔 H가 실제로 태운 배치.
#   * 유지: 발자국(`width`×`depth`)은 가구 3종의 **W0 실측 bbox 그대로** — chair 0.600×0.599 ·
#     desk 0.800×2.800 · forklift 1.214×3.495 (p7c1 W0 ⓐ, 러너 `OBSTACLE_ASSETS`의 `_source` 주석).
#     그래서 이격 산술이 형제 파일과 한 글자도 다르지 않다: 최악 자세(반대각) 0.4239 / 1.4560 /
#     1.8499 m → 창 하한 2.676 / 2.774 / 2.850 m ≥ 기준 2.27 m, seed 42 실파생 최솟값 2.797 m.
#     창 자체의 provenance(코스 사각형 · 자유공간 여유 5.840/5.700 m 거리변환 실측 · 지게차가 "자동차"
#     대체인 사유)는 형제 파일 헤더에 있다 — 여기서 복제하지 않는다(복제본은 조용히 드리프트한다).
#   * 끊은 것: **높이뿐.** 세 그룹 전부 내장 큐보이드(`asset: box`) + `height: 0.10`.
#     치수는 box 전용 필드다(USD 자산은 자기 extent를 갖고 온다 — 계약이 loud 거부).
#   * 정직한 커버리지 델타: **레지스트리 자산 해석(chair/desk/forklift USD 참조) 경로는 이 게이트에
#     없다.** 그 축은 형제 파일이 비게이트 데모로 계속 행사하고, 플랫폼 쪽에서는 p7c2 W1의 혼합 배치와
#     러너 테스트가 덮는다. 이 게이트가 덮는 축 = 가변 개수 · yaw · 표본별 배치 · 풀 다중도
#     (8 prim / cap 32, 상자는 **치수마다 별도 버킷**이라 세 발자국 = 세 버킷) · 장애물 접촉의 판정
#     반영 · `min_pass_ratio` 경로.
#
# ★ 왜 "5/5였으니 안전"이라고 쓰지 않는가: 같은 문서를 연속 두 번 돌린 T5 팔 G/G2가 **5/5 ↔ 1/5**로
#   갈렸다 — n=5 통과 비율은 이 SUT에서 신호가 아니다. 이 파일의 근거는 비율이 아니라 **연속량**이다:
#   `/scan` 검출 **0/241**과 믿음 오차 밴드 0.157~0.728 m(무장애물 팔 A와 같은 밴드, 발산 0/10).
#   `min_pass_ratio: 0.8`은 그 위에서만 쓸 만하다 — T5 §8.1은 표본당 통과율 0.68(가시 조건)에서 0.8
#   임계의 CI 초록 확률이 **≈0.49**임을 이항으로 보였고, ≥0.9가 필요한데 실측에서 거기 있는 조건은
#   **비가시 조건뿐**이었다(비가시 10표본 A+H = 10/10 pass).
#
# ★ 장애물 접촉은 판정에 **집계된다**(사양): 섀시가 `/World/cv_obstacles/...`에 닿으면 `no_collision`
#   오라클의 `collision_count`로 잡힌다. 집계에서 빼려면 `collision_excluded_paths`에
#   `/World/cv_obstacles`를 추가하면 되지만 — **이 파일은 그 손잡이를 일부러 쓰지 않는다.** 이 배치는
#   코스 밖이라 접촉이 없어야 정상이고, 접촉이 생기면 그것이 곧 신호다.
#
# ★ 정직한 한계: 그룹 안 인스턴스들은 서로 독립 draw라 상자 5개가 겹쳐 설 수 있다(계약에 인스턴스 간
#   최소 간격 개념이 없다). 정적 콜라이더끼리는 접촉 이벤트가 없어 판정 영향 0이고, 비용은 영상에서
#   겹쳐 보이는 것뿐이다(v1 수용, 형제 파일과 동일).
#
# EXPECTED = pass, exit 0. 설계 의도는 **5/5 통과**(팔 H 실측 5/5)이고 임계 0.8은 표본 하나의 흔들림을
# 흡수하는 여유다(가정 표면화: 표본 verdict는 결정론이 아니다 — 같은 seed는 같은 *입력*을 재현하지만
# SUT 비결정성은 재현하지 않는다, decisions/2026-08-19-sut-nondeterminism-out-of-scope).
#
# 같은 seed·같은 문서 = 같은 5표본(개수·좌표·yaw 전부). `seed: 42`를 바꾸면 다른 5표본이 나온다.

apiVersion: cv-infra/v1

scenario:
  scene: nova_carter_warehouse
  robot: nova_carter
  goal:                                  # 형제 파일과 동일(정본 정적) — 흔드는 축은 출발 포즈 + 장애물뿐
    x: -6.0
    y: 5.0
    yaw: 1.5708
    frame: map
  seed: 42                               # 형제 파일과 같은 시드 → 같은 좌표·개수(= 팔 H가 태운 배치)
  timeout_s: 120                         # 정본과 동일(측정 t2g 8.4~10.5 s 대비 충분)
  initial_pose:                          # PR #3의 절반 창 그대로(pass-proven) — 형제 파일 헤더 ★ 참조
    x: {uniform: [-6.3, -5.7]}
    y: {uniform: [-1.3, -0.7]}
    yaw: {uniform: [2.9916, 3.2916]}     # π ± 0.15 rad (~±8.6°)
  obstacles:                             # ↓ 세 그룹 = 가구 3종의 발자국을 **0.10 m 상자**로 모사
    - asset: box                         # 의자 자리 — W0 실측 bbox 0.600×0.599 m
      count: 1                           # 정적 개수 = draw 비소비
      x: {uniform: [-2.6, -2.0]}         # 코스에서 3.1 m 이상 → 표면 이격 ≥ 2.676 m
      y: {uniform: [1.0, 3.0]}           # yaw 생략 = 정적 0.0(위치만 랜덤)
      height: 0.10                       # ★ 밴드 바닥 0.1256 m 아래(마진 2.6 cm) — 헤더 ★T5
      width: 0.600
      depth: 0.599
    - asset: box                         # 책상 자리 — W0 실측 bbox 0.800×2.800 m
      count: {randint: [0, 5]}           # ★ 표본마다 개수가 다르다(0개 표본도 사양)
      x: {uniform: [-1.5, 0.0]}          # 목표 너머 북동쪽 개활지(자유공간 여유 5.700 m 실측점 주변)
      y: {uniform: [5.5, 10.5]}
      yaw: {uniform: [-3.1416, 3.1416]}  # 전방위 자세 — 반대각으로 이격을 잡아 자세 무관하게 성립
      height: 0.10
      width: 0.800
      depth: 2.800
    - asset: box                         # 지게차 자리 — W0 실측 bbox 1.214×3.495 m
      count: 2
      x: {uniform: [-1.0, 1.0]}          # 동쪽 개활지(자유공간 여유 5.840 m 실측점 주변)
      y: {uniform: [0.0, 4.0]}
      yaw: {choice: [0.0, 1.5708]}       # 두 자세 중 하나 — choice는 축마다 독립 draw라 한 축에만
      height: 0.10
      width: 1.214
      depth: 3.495

execution_settings:
  repeats: 5                             # = 표본 수(p6 B-U 의미론). 풀 = 표본별 최대 다중도 8 prim
  min_pass_ratio: 0.8                    # 4/5 이상 pass면 요청 verdict = pass(미선언 = any-fail)

sut:
  # identical to canonical — see nova_carter_warehouse_goal.yaml for this digest's
  # provenance. CI always overrides it; it is the standalone default. The former
  # `carter-sut:p2` was deleted in the p5c19 production cutover (not re-fetchable).
  image_ref: ghcr.io/yongjunshin/cv-infra-user/carter-sut@sha256:dc14a93cafca495419a92aee8c09070d29d38cfc62825919e192eb60390483b0

interface:
  type: ros2
  adapter_config:                        # identical to canonical (M1 canonical keys, measured values)
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:
      - /odom
      - /chassis/odom
    sensors:
      - topic: /front_3d_lidar/lidar_points
        type: sensor_msgs/msg/PointCloud2
        frame: front_3d_lidar
      - topic: /front_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: front_2d_lidar
      - topic: /back_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: back_2d_lidar
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:                     # identical to canonical — 판정 기준은 흔들지 않는다
  - oracle: reached_goal
    params:
      position_tolerance_m: 0.75
      yaw_tolerance_rad: 0.26
  - oracle: no_collision                 # 장애물 접촉이 여기 집계된다(헤더 ★)
    params:
      chassis_path: /World/Nova_Carter_ROS/chassis_link
      collision_excluded_paths:          # `/World/cv_obstacles`는 일부러 빼지 않는다
        - /World/Nova_Carter_ROS
        - /World/warehouse_with_forklifts/GroundPlane
