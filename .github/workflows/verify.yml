# Consumer verify.yml — the whole integration surface this repository maintains.
#
# One job, one `uses:`. Everything cv-infra needs is in the `with:` block below: the
# standalone Isaac script to run, the input space to expand into cases, the directory
# the script writes into (collected and zipped per case), and the script that turns
# that output into a verdict. The platform is consumed as a contract + a workflow ref
# ONLY — no relative-path reference into its source.
#
# The called workflow runs on the self-hosted GPU workstation and posts the result
# back onto this PR as a Check Run + a sticky comment + artifacts.
#
# PIN (env reproducibility): `@minimal-verify` is a BRANCH ref, used only because the
# rewritten platform has no release tag yet. MOVE IT TO THE RELEASE TAG the moment one
# exists — a branch ref can change underneath us, which is exactly what a pin prevents.
#
# SECURITY: the plain `pull_request` trigger only, never its privileged base-context
# variant — executing fork-PR head code with base secrets on a self-hosted GPU box is
# an RCE pattern. A fork PR consequently needs a maintainer's approval before it can
# reach the runner.

name: cv-infra-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Job-level `uses:` — this job carries no `runs-on`/`steps` of its own; the called
    # workflow is the definition.
    permissions:
      checks: write # post the Check Run
      pull-requests: write # upsert the sticky comment
      contents: read
    uses: yongjunshin/cv-infra-workspace/.github/workflows/verify.yml@minimal-verify
    with:
      sim_script: verify/sim.py
      sim_input_space: verify/param_space.pict
      # Must exist in the checkout (that is what verify/out/.gitkeep is for): the
      # platform mounts the case's output directory over this path.
      sim_output_dir: verify/out
      # Present = this check GATES. Remove it and the same matrix runs as a sweep.
      oracle_script: verify/oracle.py
      pict_k: 2
      repeats: 1
